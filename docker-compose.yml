version: '3.8'

services:
  ai-accessibility-auditor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_accessibility_auditor
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
